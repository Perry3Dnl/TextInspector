name: Publish TextInspector to NuGet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nuget.yml'
      - 'Directory.Build.props'
      - 'TextInspector.csproj'
      - 'TextInspector.AspNetCore/**'
      - 'docs/NUGET_README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textinspector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git fetch origin main --quiet
            test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
              echo "::error::Release tag must match current main."
              exit 1
            }
          fi
      - name: Restore and build
        run: |
          dotnet restore TextInspector.sln
          dotnet build TextInspector.sln -c Release --no-restore
      - name: Unit tests (.NET 8)
        run: dotnet test tests/TextInspector.Tests/TextInspector.Tests.csproj -c Release -f net8.0 --no-build --no-restore --collect:"XPlat Code Coverage"
      - name: Enforce 95% core line coverage
        run: python3 tools/check_coverage.py tests/TextInspector.Tests/TestResults --threshold 95
      - name: Unit tests (.NET 10)
        run: dotnet test tests/TextInspector.Tests/TextInspector.Tests.csproj -c Release -f net10.0 --no-build --no-restore
      - name: Smoke tests
        run: |
          dotnet run --project tests/TextInspector.SmokeTests -c Release --no-build --no-restore
          dotnet run --project tests/TextInspector.AspNetCore.SmokeTests -c Release --no-build --no-restore
      - name: Pack both free editions
        run: |
          mkdir -p artifacts
          dotnet pack TextInspector.csproj -c Release --no-build --no-restore -o artifacts
          dotnet pack TextInspector.AspNetCore/TextInspector.AspNetCore.csproj -c Release --no-build --no-restore -o artifacts
          test -f "artifacts/TextInspector.${{ steps.version.outputs.version }}.nupkg"
          test -f "artifacts/TextInspector.AspNetCore.${{ steps.version.outputs.version }}.nupkg"
      - name: Validate both NuGet packages have the same version and correct README
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, xml.etree.ElementTree as ET
          v = os.environ["RELEASE_VERSION"]
          for package_id in ("TextInspector", "TextInspector.AspNetCore"):
              path = pathlib.Path("artifacts") / f"{package_id}.{v}.nupkg"
              assert path.exists(), f"Missing package: {path}"
              with zipfile.ZipFile(path) as archive:
                  nuspecs = [name for name in archive.namelist() if name.endswith(".nuspec")]
                  assert len(nuspecs) == 1, f"Expected one nuspec in {path}"
                  root = ET.fromstring(archive.read(nuspecs[0]))
                  def get(tag):
                      node = root.find(f".//{tag}")
                      assert node is not None and node.text, f"Missing {tag} in {path}"
                      return node.text
                  assert get("id") == package_id, f"Wrong package ID in {path}"
                  assert get("version") == v, f"Wrong package version in {path}"
                  readme = get("readme")
                  assert readme == "NUGET_README.md", f"Wrong readme in {path}: {readme}"
                  assert readme in archive.namelist(), f"Missing packed README in {path}"
                  body = archive.read(readme).decode("utf-8")
                  assert f"--version {v}" in body, f"README version out of sync: {path}"
                  if package_id == "TextInspector.AspNetCore":
                      deps = root.findall(".//{*}dependency")
                      assert any(d.attrib.get("id") == "TextInspector" and v in d.attrib.get("version", "") for d in deps), "ASP.NET Core must depend on matching core version"
              print(f"Verified {package_id} {v}: ID, version, README, dependencies")
          PY
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: textinspector-release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  dispatch-tagged-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Create tag and dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA" || {
              echo "::error::$tag already points at another commit."
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nuget.yml/dispatches" -f ref="$tag"

  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: textinspector-release-packages
          path: artifacts
      - name: Authenticate with NuGet Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME || github.repository_owner }}
      - name: Publish TextInspector
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: dotnet nuget push "artifacts/TextInspector.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish TextInspector.AspNetCore
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: dotnet nuget push "artifacts/TextInspector.AspNetCore.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Confirm both versions are indexed by NuGet.org
        env:
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          version = os.environ["VERSION"]
          for package_id in ("textinspector", "textinspector.aspnetcore"):
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id}/index.json"
              for attempt in range(20):
                  try:
                      req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          versions = json.load(response).get("versions", [])
                      if version in versions:
                          print(f"NuGet.org confirmed {package_id} {version}")
                          break
                  except Exception as exc:
                      print(f"NuGet index check: {exc}")
                  if attempt == 19:
                      raise SystemExit(f"Package {package_id} {version} not visible in NuGet.org after polling")
                  time.sleep(15)
          PY
      - name: Create GitHub release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "TextInspector $VERSION" --generate-notes --verify-tag --latest
          fi
          gh release upload "$tag" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
