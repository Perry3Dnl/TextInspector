name: TextInspector CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore TextInspector.sln
      - name: Build all TextInspector targets
        run: dotnet build TextInspector.sln -c Release --no-restore
      - name: Unit tests (.NET 8)
        run: dotnet test tests/TextInspector.Tests/TextInspector.Tests.csproj -c Release -f net8.0 --no-build --no-restore --collect:"XPlat Code Coverage"
      - name: Enforce 95% core line coverage
        run: python3 tools/check_coverage.py tests/TextInspector.Tests/TestResults --threshold 95
      - name: Unit tests (.NET 10)
        run: dotnet test tests/TextInspector.Tests/TextInspector.Tests.csproj -c Release -f net10.0 --no-build --no-restore
      - name: Core smoke tests
        run: dotnet run --project tests/TextInspector.SmokeTests -c Release --no-build --no-restore
      - name: ASP.NET Core smoke tests
        run: dotnet run --project tests/TextInspector.AspNetCore.SmokeTests -c Release --no-build --no-restore
      - name: Pack
        run: |
          dotnet pack TextInspector.csproj -c Release --no-build --no-restore -o artifacts
          dotnet pack TextInspector.AspNetCore/TextInspector.AspNetCore.csproj -c Release --no-build --no-restore -o artifacts
      - name: Install packed TextInspector into clean consumer
        shell: bash
        run: |
          mkdir -p /tmp/textinspector-consumer
          cd /tmp/textinspector-consumer
          dotnet new console --framework net8.0
          dotnet add package TextInspector --version 1.1.0 --source "$GITHUB_WORKSPACE/artifacts"
          cat > Program.cs <<'EOF'
          using TextInspector;
          var engine = TextInspectorEngine.Create();
          var report = engine.CreateReport("Contact us at hello@example.com.");
          if(engine.CompiledRuleCount != 76 || !report.HasDetections || report.RequiresReview || report.RiskAssessment.TotalRiskPoints != 0)
              throw new Exception("Packed TextInspector consumer failed.");
          if(typeof(TextInspectorEngine).GetMethods().Any(method => method.Name == "Compile"))
              throw new Exception("Custom rule compilation must not be public in TextInspector.");
          Console.WriteLine("Packed TextInspector consumer passed.");
          EOF
          dotnet run -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-test-results
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            tests/TextInspector.Tests/TestResults/**
